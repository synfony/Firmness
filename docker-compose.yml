services:
  # 1. Test Runner Service
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: firmness_tests

  # 2. Database Service
  db:
    image: postgres:16 # Using a more common version
    container_name: firmness_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwe.123*
      POSTGRES_DB: firmness
    ports:
      - "5544:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data # Using a bind mount instead of a named volume
    restart: unless-stopped
    # This service will not start until the 'tests' service completes successfully.
    depends_on:
      tests:
        condition: service_completed_successfully

  # 3. API Service
  api:
    build:
      context: .
      dockerfile: FIrmnessAPI/Dockerfile
    container_name: firmness_api
    ports:
      - "8081:8080" # Exposing on 8081, container runs on 80
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=firmness;Username=postgres;Password=Qwe.123*"
    depends_on:
      - db
    restart: on-failure

  # 4. Admin (Web) Service
  admin:
    build:
      context: .
      dockerfile: Firmness.Web/Dockerfile
    container_name: firmness_admin
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=firmness;Username=postgres;Password=Qwe.123*"
    depends_on:
      - db
    restart: on-failure

  # 5. Client (Vue) Service
  client:
    build:
      context: ./firmness-client
      dockerfile: Dockerfile
      args:
        # Pass the API URL to the Vue build
        VITE_API_BASE_URL: http://localhost:8081/api
    container_name: firmness_client
    ports:
      - "5173:80" # Exposing on 5173, Nginx runs on 80
    depends_on:
      - api
    restart: on-failure

  # 6. Summary Service
  summary:
    image: alpine:latest
    container_name: firmness_summary
    command: |
      sh -c "echo '==================================================' && \
             echo '✅ Your services are up and running!' && \
             echo '' && \
             echo '🔗 Access your applications here:' && \
             echo '-----------------------------------' && \
             echo '🔹 Admin Panel: http://localhost:8080' && \
             echo '🔹 User Client: http://localhost:5173' && \
             echo '🔹 API Base:    http://localhost:8081/api' && \
             echo '=================================================='"
    depends_on:
      - admin
      - client

# The named volume is no longer needed
volumes: {}
