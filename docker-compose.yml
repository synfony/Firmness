services:
  # PostgreSQL Database Service
  db:
    image: postgres:18
    container_name: firmness_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwe.123*
      POSTGRES_DB: firmness
    ports:
      - "5544:5432"
    volumes:
      - firmness_postgres_data:/var/lib/postgresql
    restart: unless-stopped

  # ASP.NET Core Web API
  api:
    build:
      context: .
      dockerfile: Dockerfile.unified
      target: final-api
    container_name: firmness_api
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_URLS: "http://+:8081"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=firmness;Username=postgres;Password=Qwe.123*"
    depends_on:
      - db
    restart: on-failure

  # ASP.NET Core Web Application (Admin)
  web:
    build:
      context: .
      dockerfile: Dockerfile.unified
      target: final-web
    container_name: firmness_web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=firmness;Username=postgres;Password=Qwe.123*"
    depends_on:
      - db
    restart: on-failure

  # Next.js Client Frontend
  client:
    image: firmness-client # Usar una imagen pre-construida
    # build:
    #   context: firmness-client
    #   dockerfile: Dockerfile
    container_name: firmness_client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8081"
    depends_on:
      - api
    restart: on-failure

volumes:
  firmness_postgres_data:
    driver: local
